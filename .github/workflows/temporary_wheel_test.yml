# Temporary: build the wheels on every pull request, to test packaging
# options. Separate from ci.yml, which keeps its own triggers. Remove when done.
name: Wheel test

on:
  pull_request:

jobs:
  # The sdist, and one wheel per platform carrying the native terrain collision
  # library (NATIVE_COLLISION_BUILD.md). The library doesn't use Python.h, so a
  # single py3-none-<platform> wheel serves every Python.
  build_wheels:
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64  # Panda3D's own toolchain
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # newest the package supports
      - run: pip install build
      - run: python -m build  # the sdist, and the pure wheel the platform one starts from
      - uses: actions/cache@v4
        with:
          path: .cache/native
          key: native-deps-${{ hashFiles('scripts/fetch_native_deps.sh') }}
      - run: scripts/fetch_native_deps.sh
      # docker run, not a job container: the actions above don't run on the
      # image's old glibc.
      - run: |
          docker run --rm -v "$PWD":/io ${{ matrix.image }} \
            /io/scripts/build_manylinux_wheel.sh "/io/$(ls dist/*-py3-none-any.whl)" /io/wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x86_64'
        with:
          name: sdist
          path: dist/*.tar.gz

  # Install each platform wheel in a clean venv and run the whole suite against
  # it: the wheel must carry everything the package needs, generated files
  # (_version.py) and the native library included (no collision test skipped).
  test_wheels:
    needs: build_wheels
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64]
        python: ["3.12", "3.13", "3.14"]
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4  # for the tests only
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse/
      - run: python -m venv "$RUNNER_TEMP/venv"
      - run: '"$RUNNER_TEMP/venv/bin/pip" install wheelhouse/*.whl pytest pytest-xdist typing-extensions'
      - name: The package and its library come from the wheel
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import world_builder; assert 'site-packages' in world_builder.__file__, world_builder.__file__"
          readelf -d "$RUNNER_TEMP"/venv/lib/python*/site-packages/world_builder/terrain/native/*.so > dynamic.txt
          grep -E 'NEEDED|PATH' dynamic.txt
          # The manylinux2014 linker writes RPATH, newer ones RUNPATH.
          grep -qE 'R(UN)?PATH.*\$ORIGIN/\.\./\.\./\.\./panda3d' dynamic.txt
      - run: '"$RUNNER_TEMP/venv/bin/python" -m pytest tests -n auto'
        env:
          WORLD_BUILDER_REQUIRE_NATIVE: "1"
