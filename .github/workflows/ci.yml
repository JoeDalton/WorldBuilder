name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:

jobs:
  test_linux_with_coverage:
    runs-on: ubuntu-latest  # x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install poetry invoke poetry-dynamic-versioning
      - run: poetry install
      - run: invoke coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  test_other_os:
    strategy:
    # Prevent the entire job from failing as soon as one of the runners fails
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04-arm  # arm64
          - runner: windows-latest  # x86_64
          - runner: macos-latest  # arm64
          - runner: macos-15-intel  # x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install poetry invoke poetry-dynamic-versioning
      - run: poetry install
      - run: invoke test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install poetry invoke poetry-dynamic-versioning
      - run: invoke develop quality

  # On every push (main and version tags, pull requests excluded):
  # the sdist, and one wheel per platform carrying the native terrain collision
  # library (NATIVE_COLLISION_BUILD.md). The library doesn't use Python.h, so a
  # single py3-none-<platform> wheel serves every Python.
  build_wheels:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64  # Panda3D's own toolchain
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # newest the package supports
      - run: pip install build
      - run: python -m build  # the sdist, and the pure wheel the platform one starts from
      - uses: actions/cache@v4
        with:
          path: .cache/native
          key: native-deps-${{ hashFiles('scripts/fetch_native_deps.sh') }}
      - run: scripts/fetch_native_deps.sh
      # docker run, not a job container: the actions above don't run on the
      # image's old glibc.
      - run: |
          docker run --rm -v "$PWD":/io ${{ matrix.image }} \
            /io/scripts/build_manylinux_wheel.sh "/io/$(ls dist/*-py3-none-any.whl)" /io/wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x86_64'
        with:
          name: sdist
          path: dist/*.tar.gz

  # Install each platform wheel in a clean venv and run the whole suite against
  # it: the wheel must carry everything the package needs, generated files
  # (_version.py) and the native library included (no collision test skipped).
  test_wheels:
    if: github.event_name == 'push'
    needs: build_wheels
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64]
        python: ["3.12", "3.13", "3.14"]
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4  # for the tests only
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse/
      - run: python -m venv "$RUNNER_TEMP/venv"
      - run: '"$RUNNER_TEMP/venv/bin/pip" install wheelhouse/*.whl pytest pytest-xdist typing-extensions'
      - name: The package and its library come from the wheel
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import world_builder; assert 'site-packages' in world_builder.__file__, world_builder.__file__"
          readelf -d "$RUNNER_TEMP"/venv/lib/python*/site-packages/world_builder/terrain/native/*.so > dynamic.txt
          grep -E 'NEEDED|PATH' dynamic.txt
          # The manylinux2014 linker writes RPATH, newer ones RUNPATH.
          grep -qE 'R(UN)?PATH.*\$ORIGIN/\.\./\.\./\.\./panda3d' dynamic.txt
      - run: '"$RUNNER_TEMP/venv/bin/python" -m pytest tests -n auto'
        env:
          WORLD_BUILDER_REQUIRE_NATIVE: "1"

  # On a version tag, attach the tested platform wheels and the sdist to its
  # GitHub release (created if missing). Depend on a wheel's URL, not the tag's
  # source zip: an uploaded asset never changes, so its locked hash holds.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test_linux_with_coverage, test_other_os, quality, build_wheels, test_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - run: test -f "dist/world_builder-$TAG-py3-none-manylinux2014_x86_64.whl"  # version == tag
      - run: gh release view "$TAG" > /dev/null || gh release create "$TAG" --verify-tag --generate-notes
      - run: gh release upload "$TAG" dist/* --clobber
