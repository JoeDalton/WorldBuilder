# The rocky Jupiter-scale planet (PRESETS["jupiter_rocky"], 69911 km, a
# 9.925 h day): no stamps, no paints (the demo level's are placed for its
# 600 km planet, and its radius would override the preset's). Mid-latitudes,
# among its many jets and small storms.
planet:
  preset: jupiter_rocky
  seed: 19
  reference: {lat: 40.0, lon: 10.0}

camera: {x: 0, y: 0, z: 2500, heading: -90, pitch: -8}
