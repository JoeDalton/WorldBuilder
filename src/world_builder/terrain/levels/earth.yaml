# The Earth-scale planet (PRESETS["earth"], 6371 km, a 23.934 h day): no
# stamps, no paints (the demo level's are placed for its 600 km planet, and
# its radius would override the preset's). Mid-latitudes, under the storm
# track's lows.
planet:
  preset: earth
  seed: 19
  reference: {lat: 45.0, lon: 10.0}

camera: {x: 0, y: 0, z: 2500, heading: -90, pitch: -8}
