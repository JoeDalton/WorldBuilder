# Demo level: a temperate coast (sea to the north, snowy range to the south)
# with four hand-made features near the start. F1-F4 in the demo swap the
# planet preset under them; the stamps and paints stay put.
planet:
  preset: earthlike
  seed: 19
  reference: {lat: 42.0, lon: 10.0}

stamps:
  # 0: an impact crater, carved into whatever terrain lies there
  - heightmap: stamps/crater.png
    center: {x: -4500, y: -2500}
    size: [5000, 5000]
    height_scale: 700
    height_offset: -245   # 0.35 * scale: the image's rim-to-edge level adds nothing
    blend: add
    falloff: 400
  # 1: a terraced mesa, raised to an absolute height
  - heightmap: stamps/mesa.png
    center: {x: 3500, y: 2500}
    size: [4500, 4500]
    rotation: 20
    height_scale: 750
    height_offset: 0
    blend: max
    falloff: 300
  # 2: a landing pad levelled to the ground at its centre, with a low berm
  - heightmap: stamps/pad.png
    center: {x: 400, y: -1500}
    size: [1400, 700]
    rotation: 15
    height_scale: 10
    height_offset: 0.5
    blend: flatten
    falloff: 250

  # 3: a lake under a sheer cliff, set to absolute heights (water at sea level)
  - heightmap: stamps/lake.png
    center: {x: -4500, y: 4500}
    size: [5000, 5000]
    height_scale: 600
    height_offset: -60   # pixel 0.1 = sea level, where the water lies
    blend: replace
    falloff: 700

paints:
  - mask: stamps/crater_paint.png
    stamp: 0
    colors: {"#808080": rock, "#e0c080": desert}
    falloff: 120
  - mask: stamps/pad_paint.png
    stamp: 2
    colors: {"#ffe678": beach}
    falloff: 30
  - mask: stamps/lake_paint.png
    stamp: 3
    colors: {"#2e6b2e": forest}
    falloff: 60

# South of the features, on the flank of the range, looking north to the coast.
camera: {x: -2000, y: -10000, z: 1900, heading: 0, pitch: -8}
