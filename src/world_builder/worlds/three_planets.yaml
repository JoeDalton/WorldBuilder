# Three planets: the home planet and its moon, an ice planet 3000 km across and its ring.
# A world file defines the objects and nothing about running them: no quality,
# no camera. Bodies and fields are linked files of this folder; keys beside
# `file` (name, position, axis) replace the file's.
# Metres, world frame; the sun is one direction (toward it) and a colour.
sun:
  direction: [0.887774, 0.045991, -0.457976]
  color: [2.6, 2.5, 2.35]
  angular_radius: 0.009599310885968814
sky:
  stars:
    seed: 3
    stars: 14000
    galactic_pole: [0.25, -0.55, 0.8]
    glow_size: 256
    nebula_scale: 1.0
    nebula_coverage: 0.5
    red: 0.25
    blue: 0.25
  star_intensity: 0.6
  star_brightness: 8.0
  nebula:
    palette:
    - [0.55, 0.2, 0.5]
    - [0.85, 0.25, 0.35]
    - [0.35, 0.25, 0.75]
    intensity: 0.01
    milky_way: [0.06, 0.057, 0.051]
  sun_radiance: [4000.0, 3800.0, 3500.0]
  exposure: 0.9
  star_hpr: [0.0, 0.0, 0.0]
  star_adaptation: 60.0
space_ambient: [0.025, 0.025, 0.03]
bodies:
  - {name: planet, file: kerbin.yaml, position: [0.0, 0.0, 0.0]}
  - {name: moon, file: moon.yaml, position: [-1865003.832969, -1094191.249821, 20888382.086984]}
  - {name: ice, file: ice.yaml, position: [60000000.0, 15000000.0, 0.0]}
fields:
  # the ring's axis (its normal) is tilted off the world's z
  - {name: ring, file: ring.yaml, position: [60000000.0, 15000000.0, 0.0], axis: [0.25, 0.1, 1.0]}
